{% assign heading_level = include.heading_level | default: 3 %}
<article class="blog-card">
  <h{{ heading_level }}><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h{{ heading_level }}>
  <p><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%B %d, %Y' }}</time></p>
  {% if include.post.description %}<p>{{ include.post.description | escape }}</p>{% endif %}
</article>
